<svg width="800" height="1500" viewBox="0 0 800 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g filter="url(#glow_blur)">
    <!-- Cyan & Blue upper glow -->
    <ellipse cx="120" cy="380" rx="320" ry="360" fill="#2563eb" fill-opacity="0.55"/>
    <ellipse cx="80" cy="300" rx="220" ry="260" fill="#38bdf8" fill-opacity="0.45"/>
    <!-- Violet & Purple lower glow -->
    <ellipse cx="140" cy="920" rx="340" ry="400" fill="#7c3aed" fill-opacity="0.5"/>
    <ellipse cx="100" cy="1000" rx="250" ry="300" fill="#a855f7" fill-opacity="0.4"/>
  </g>
  <defs>
    <filter id="glow_blur" x="-450" y="-250" width="1600" height="2000" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="130" result="effect1_blur"/>
    </filter>
  </defs>
</svg>
